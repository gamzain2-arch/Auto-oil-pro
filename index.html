<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Auto Oil Pro</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#0b0f14;
    color:#fff;
    min-height:100vh;
}

header{
    background:#111820;
    padding:20px;
    text-align:center;
    border-bottom:1px solid #26313d;
}

header h1{
    font-size:28px;
    margin-bottom:8px;
}

.badge{
    display:inline-block;
    background:#1d8cff;
    padding:5px 12px;
    border-radius:20px;
    font-size:12px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.search-box{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.search-box input{
    flex:1;
    padding:15px;
    border-radius:12px;
    border:1px solid #34414f;
    background:#151d26;
    color:#fff;
    font-size:16px;
}

button{
    border:none;
    border-radius:12px;
    padding:12px 18px;
    background:#1d8cff;
    color:white;
    font-size:15px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.quick{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:25px;
}

.quick button{
    background:#18222d;
    border:1px solid #304050;
    font-size:13px;
}

.card{
    background:#111820;
    border:1px solid #26313d;
    border-radius:16px;
    padding:18px;
    margin-bottom:15px;
}

.card h2{
    margin-bottom:15px;
    color:#5eb0ff;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.info{
    background:#18212b;
    padding:12px;
    border-radius:10px;
}

.label{
    color:#8e9baa;
    font-size:12px;
    margin-bottom:5px;
}

.value{
    font-size:15px;
}

.warning{
    background:#3a2e12;
    border:1px solid #765d20;
    color:#ffd76a;
    padding:12px;
    border-radius:10px;
    margin-top:15px;
    line-height:1.6;
}

.empty{
    text-align:center;
    color:#8995a2;
    padding:30px 10px;
}

.item{
    background:#18212b;
    padding:13px;
    border-radius:10px;
    margin-bottom:8px;
}

.item strong{
    display:block;
    margin-bottom:5px;
}

.section-title{
    margin:25px 0 12px;
    color:#fff;
    font-size:20px;
}

.status{
    text-align:center;
    color:#7f8b98;
    font-size:13px;
    margin-top:20px;
}

@media(max-width:600px){
    .search-box{
        flex-direction:column;
    }

    .info-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>🚗 Auto Oil Pro</h1>
    <span class="badge">V2.1</span>
</header>

<div class="container">

    <div class="search-box">
        <input
            id="searchInput"
            type="text"
            placeholder="اكتب اسم السيارة أو الموديل..."
            onkeydown="if(event.key==='Enter') searchCar()"
        >
        <button onclick="searchCar()">🔍 بحث</button>
    </div>

    <div class="quick">
        <button onclick="quickSearch('Toyota Camry 2018')">
            Toyota Camry 2018
        </button>

        <button onclick="quickSearch('Chevrolet Aveo 2010')">
            Chevrolet Aveo 2010
        </button>

        <button onclick="quickSearch('Hyundai Elantra 2017')">
            Hyundai Elantra 2017
        </button>
    </div>

    <div id="result"></div>

    <h2 class="section-title">🛢️ زيوت المحرك</h2>
    <div id="oils"></div>

    <h2 class="section-title">⚙️ زيوت القير</h2>
    <div id="transmissions"></div>

    <h2 class="section-title">🔧 فلاتر الزيت</h2>
    <div id="filters"></div>

    <div class="status" id="status">
        جاري تحميل قاعدة البيانات...
    </div>

</div>

<script>

let inventory = {
    engine_oils: [],
    transmission_fluids: [],
    oil_filters_raw: []
};

/* =========================
   تحميل inventory.json
========================= */

async function loadInventory(){

    const status = document.getElementById("status");

    try{

        const response = await fetch("./inventory.json", {
            cache: "no-store"
        });

        if(!response.ok){
            throw new Error("HTTP " + response.status);
        }

        inventory = await response.json();

        console.log("Inventory loaded:", inventory);

        renderInventory();

        status.textContent = "✅ قاعدة البيانات محملة بنجاح";

    }catch(error){

        console.error(error);

        status.textContent =
            "❌ تعذر تحميل inventory.json — تأكد أن الملف موجود بنفس مجلد index.html";

        renderInventory();

    }
}


/* =========================
   عرض البيانات
========================= */

function renderInventory(){

    renderOils();
    renderTransmissions();
    renderFilters();

}


/* =========================
   زيوت المحرك
========================= */

function renderOils(){

    const box = document.getElementById("oils");

    box.innerHTML = "";

    if(
        !inventory.engine_oils ||
        inventory.engine_oils.length === 0
    ){

        box.innerHTML =
            '<div class="empty">لا توجد زيوت في قاعدة البيانات</div>';

        return;
    }

    inventory.engine_oils.forEach((oil)=>{

        let name = "";

        if(typeof oil === "string"){

            name = oil;

        }else{

            name =
                oil.name ||
                oil.brand ||
                oil.product ||
                oil.viscosity ||
                JSON.stringify(oil);

        }

        box.innerHTML += `
            <div class="item">
                <strong>🛢️ ${escapeHtml(name)}</strong>
            </div>
        `;

    });

}


/* =========================
   زيوت القير
========================= */

function renderTransmissions(){

    const box = document.getElementById("transmissions");

    box.innerHTML = "";

    if(
        !inventory.transmission_fluids ||
        inventory.transmission_fluids.length === 0
    ){

        box.innerHTML =
            '<div class="empty">لا توجد زيوت قير في قاعدة البيانات</div>';

        return;
    }

    inventory.transmission_fluids.forEach((fluid)=>{

        let name = "";

        if(typeof fluid === "string"){

            name = fluid;

        }else{

            name =
                fluid.name ||
                fluid.brand ||
                fluid.product ||
                JSON.stringify(fluid);

        }

        box.innerHTML += `
            <div class="item">
                <strong>⚙️ ${escapeHtml(name)}</strong>
            </div>
        `;

    });

}


/* =========================
   الفلاتر
========================= */

function renderFilters(){

    const box = document.getElementById("filters");

    box.innerHTML = "";

    if(
        !inventory.oil_filters_raw ||
        inventory.oil_filters_raw.length === 0
    ){

        box.innerHTML =
            '<div class="empty">لا توجد فلاتر في قاعدة البيانات</div>';

        return;
    }

    inventory.oil_filters_raw.forEach((filter)=>{

        let name = "";

        if(typeof filter === "string"){

            name = filter;

        }else{

            name =
                filter.name ||
                filter.code ||
                filter.brand ||
                JSON.stringify(filter);

        }

        box.innerHTML += `
            <div class="item">
                <strong>🔧 ${escapeHtml(name)}</strong>
            </div>
        `;

    });

}


/* =========================
   البحث عن السيارة
========================= */

const cars = [

    {
        name:"Toyota Camry 2018",
        engine:"2.5L",
        cylinders:"4",
        transmission:"Automatic",
        oil:"غير محدد",
        oilQty:"غير محدد",
        gearOil:"غير محدد",
        filter:"غير محدد"
    },

    {
        name:"Chevrolet Aveo 2010",
        engine:"1.6L",
        cylinders:"4",
        transmission:"Automatic / Manual",
        oil:"غير محدد",
        oilQty:"غير محدد",
        gearOil:"غير محدد",
        filter:"غير محدد"
    },

    {
        name:"Hyundai Elantra 2017",
        engine:"2.0L",
        cylinders:"4",
        transmission:"Automatic",
        oil:"غير محدد",
        oilQty:"غير محدد",
        gearOil:"غير محدد",
        filter:"غير محدد"
    }

];


function searchCar(){

    const input =
        document.getElementById("searchInput").value
        .trim()
        .toLowerCase();

    const result =
        document.getElementById("result");

    if(!input){

        result.innerHTML = `
            <div class="card">
                <div class="empty">
                    اكتب اسم السيارة أولاً 🔍
                </div>
            </div>
        `;

        return;
    }

    const matches = cars.filter(car =>
        car.name.toLowerCase().includes(input)
    );

    if(matches.length === 0){

        result.innerHTML = `
            <div class="card">
                <div class="empty">
                    ❌ ما لكيت سيارة بهذا الاسم حالياً
                    <br><br>
                    قاعدة السيارات راح نوسعها بالخطوة الجاية.
                </div>
            </div>
        `;

        return;
    }

    result.innerHTML = "";

    matches.forEach(showResult);

}


function quickSearch(name){

    document.getElementById("searchInput").value = name;

    searchCar();

}


function showResult(car){

    const result =
        document.getElementById("result");

    result.innerHTML += `

        <div class="card">

            <h2>🚗 ${escapeHtml(car.name)}</h2>

            <div class="info-grid">

                <div class="info">
                    <div class="label">سعة المحرك</div>
                    <div class="value">
                        ${escapeHtml(car.engine)}
                    </div>
                </div>

                <div class="info">
                    <div class="label">عدد السلندرات</div>
                    <div class="value">
                        ${escapeHtml(car.cylinders)}
                    </div>
                </div>

                <div class="info">
                    <div class="label">نوع القير</div>
                    <div class="value">
                        ${escapeHtml(car.transmission)}
                    </div>
                </div>

                <div class="info">
                    <div class="label">زيت المحرك</div>
                    <div class="value">
                        ${escapeHtml(car.oil)}
                    </div>
                </div>

                <div class="info">
                    <div class="label">كمية زيت المحرك</div>
                    <div class="value">
                        ${escapeHtml(car.oilQty)}
                    </div>
                </div>

                <div class="info">
                    <div class="label">زيت القير</div>
                    <div class="value">
                        ${escapeHtml(car.gearOil)}
                    </div>
                </div>

                <div class="info">
                    <div class="label">فلتر الزيت</div>
                    <div class="value">
                        ${escapeHtml(car.filter)}
                    </div>
                </div>

            </div>

            <div class="warning">
                ⚠️ تنبيه:
                معلومات السعات والتوافق غير معتمدة بعد.
                لن نعتمد مواصفة للسيارة قبل التحقق من مصدر موثوق.
            </div>

        </div>

    `;

}


/* =========================
   حماية النص
========================= */

function escapeHtml(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================
   تشغيل البرنامج
========================= */

loadInventory();

</script>

</body>
</html>
