<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto Oil Pro</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0f1115;
    color:#fff;
}

.container{
    max-width:900px;
    margin:auto;
    padding:18px;
}

header{
    text-align:center;
    padding:20px 10px;
}

h1{
    margin:0 0 8px;
    font-size:30px;
}

.badge{
    display:inline-block;
    padding:5px 12px;
    border-radius:20px;
    background:#222831;
    color:#00d4ff;
    font-size:13px;
}

.card{
    background:#181c23;
    border:1px solid #292f38;
    border-radius:15px;
    padding:16px;
    margin:14px 0;
}

.search{
    display:flex;
    gap:8px;
}

input,select{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #343b46;
    background:#101318;
    color:#fff;
    font-size:16px;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 16px;
    background:#00a8ff;
    color:white;
    font-size:15px;
    font-weight:bold;
}

button:active{
    transform:scale(.98);
}

.quick{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:12px;
}

.quick button{
    background:#252c35;
    font-size:13px;
}

.section-title{
    font-size:21px;
    margin:22px 0 10px;
}

.item{
    background:#20252d;
    border:1px solid #303741;
    border-radius:12px;
    padding:13px;
    margin:8px 0;
}

.small{
    color:#aeb7c2;
    font-size:13px;
    margin-top:5px;
}

.empty{
    color:#9ba5b1;
    text-align:center;
    padding:15px;
}

.status{
    text-align:center;
    padding:10px;
    border-radius:10px;
    background:#171b21;
    color:#b8c1cb;
    margin-top:12px;
}

.info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.info div{
    background:#20252d;
    padding:10px;
    border-radius:9px;
}

.selector{
    display:grid;
    gap:10px;
    margin-top:12px;
}

.selector label{
    color:#b8c1cb;
    font-size:14px;
}

.selector button{
    width:100%;
    margin-top:4px;
}

@media(max-width:600px){

    .search{
        flex-direction:column;
    }

    .info{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>🚗 Auto Oil Pro</h1>
    <span class="badge">V2.2</span>
</header>


<!-- =========================
     اختيار السيارة
========================= -->

<div class="card">

    <h2>🔎 اختيار السيارة</h2>

    <div class="selector">

        <div>
            <label>الشركة</label>
            <select id="makeSelect" onchange="updateModels()">
                <option value="">اختر الشركة</option>
            </select>
        </div>

        <div>
            <label>الموديل</label>
            <select id="modelSelect" onchange="updateYears()" disabled>
                <option value="">اختر الموديل</option>
            </select>
        </div>

        <div>
            <label>السنة</label>
            <select id="yearSelect" onchange="updateEngines()" disabled>
                <option value="">اختر السنة</option>
            </select>
        </div>

        <div>
            <label>المحرك</label>
            <select id="engineSelect" disabled>
                <option value="">اختر المحرك</option>
            </select>
        </div>

        <button onclick="showSelectedCar()">
            🚗 عرض مواصفات السيارة
        </button>

    </div>

</div>


<!-- =========================
     البحث النصي
========================= -->

<div class="card">

    <div class="search">

        <input
            id="searchInput"
            placeholder="أو اكتب اسم السيارة..."
            onkeydown="if(event.key==='Enter') searchCar()"
        >

        <button onclick="searchCar()">
            🔍 بحث
        </button>

    </div>

    <div class="quick">

        <button onclick="quickSearch('Toyota Camry 2018')">
            Camry 2018
        </button>

        <button onclick="quickSearch('Chevrolet Aveo 2010')">
            Aveo 2010
        </button>
