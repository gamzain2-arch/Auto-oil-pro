<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto Oil Pro</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0f1115;
    color:#fff;
}
.container{
    max-width:900px;
    margin:auto;
    padding:18px;
}
header{
    text-align:center;
    padding:20px 10px;
}
h1{
    margin:0 0 8px;
    font-size:30px;
}
.badge{
    display:inline-block;
    padding:5px 12px;
    border-radius:20px;
    background:#222831;
    color:#00d4ff;
    font-size:13px;
}
.card{
    background:#181c23;
    border:1px solid #292f38;
    border-radius:15px;
    padding:16px;
    margin:14px 0;
}
.search{
    display:flex;
    gap:8px;
}
input{
    flex:1;
    padding:14px;
    border-radius:10px;
    border:1px solid #343b46;
    background:#101318;
    color:#fff;
    font-size:16px;
}
button{
    border:0;
    border-radius:10px;
    padding:12px 16px;
    background:#00a8ff;
    color:white;
    font-size:15px;
    font-weight:bold;
}
button:active{
    transform:scale(.98);
}
.quick{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:12px;
}
.quick button{
    background:#252c35;
    font-size:13px;
}
.section-title{
    font-size:21px;
    margin:22px 0 10px;
}
.item{
    background:#20252d;
    border:1px solid #303741;
    border-radius:12px;
    padding:13px;
    margin:8px 0;
}
.small{
    color:#aeb7c2;
    font-size:13px;
    margin-top:5px;
}
.empty{
    color:#9ba5b1;
    text-align:center;
    padding:15px;
}
.status{
    text-align:center;
    padding:10px;
    border-radius:10px;
    background:#171b21;
    color:#b8c1cb;
    margin-top:12px;
}
.info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}
.info div{
    background:#20252d;
    padding:10px;
    border-radius:9px;
}
@media(max-width:600px){
    .search{
        flex-direction:column;
    }
    .info{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>🚗 Auto Oil Pro</h1>
    <span class="badge">V2.1</span>
</header>

<div class="card">
    <div class="search">
        <input id="searchInput" placeholder="اكتب اسم السيارة...">
        <button onclick="searchCar()">🔍 بحث</button>
    </div>

    <div class="quick">
        <button onclick="quickSearch('Toyota Camry 2018')">Camry 2018</button>
        <button onclick="quickSearch('Chevrolet Aveo 2010')">Aveo 2010</button>
        <button onclick="quickSearch('Hyundai Elantra 2017')">Elantra 2017</button>
    </div>
</div>

<div id="result"></div>

<div id="status" class="status">
    ⏳ جاري تحميل قاعدة البيانات...
</div>

<h2 class="section-title">🛢️ زيوت المحرك</h2>
<div id="oils"></div>

<h2 class="section-title">⚙️ زيوت القير</h2>
<div id="transmissions"></div>

<h2 class="section-title">🔧 فلاتر الزيت</h2>
<div id="filters"></div>

<h2 class="section-title">📦 مخزون الزيوت</h2>
<div id="stock"></div>

</div>

<script>

let inventory = {
    engine_oils: [],
    transmission_fluids: [],
    oil_filters_raw: []
};

async function loadInventory(){

    const status = document.getElementById("status");

    try{

        const response = await fetch("./inventory.json", {
            cache:"no-store"
        });

        if(!response.ok){
            throw new Error("HTTP " + response.status);
        }

        inventory = await response.json();

        console.log("Inventory loaded:", inventory);

        renderInventory();

        status.textContent = "✅ قاعدة البيانات محملة بنجاح";

    }catch(error){

        console.error(error);

        status.textContent =
        "❌ تعذر تحميل inventory.json — تأكد أن الملف موجود بنفس مجلد index.html";

        renderInventory();
    }
}

function renderInventory(){

    renderOils();
    renderTransmissions();
    renderFilters();
    renderStock();
}

function renderOils(){

    const box = document.getElementById("oils");

    box.innerHTML = "";

    if(
        !inventory.engine_oils ||
        inventory.engine_oils.length === 0
    ){

        box.innerHTML =
        '<div class="card"><div class="empty">لا توجد زيوت محرك في قاعدة البيانات</div></div>';

        return;
    }

    inventory.engine_oils.forEach((oil)=>{

        let name = "";
        let brand = "";
        let viscosity = "";

        if(typeof oil === "string"){

            name = oil;

        }else{

            brand = oil.brand || "";
            name = oil.name || oil.product || "";
            viscosity = oil.viscosity || "";

        }

        box.innerHTML += `
            <div class="item">
                <strong>🛢️ ${escapeHtml(name)}</strong>

                ${
                    brand
                    ? `<div class="small">الشركة: ${escapeHtml(brand)}</div>`
                    : ""
                }

                ${
                    viscosity
                    ? `<div class="small">اللزوجة: ${escapeHtml(viscosity)}</div>`
                    : ""
                }
            </div>
        `;
    });
}

function renderTransmissions(){

    const box = document.getElementById("transmissions");

    box.innerHTML = "";

    if(
        !inventory.transmission_fluids ||
        inventory.transmission_fluids.length === 0
    ){

        box.innerHTML =
        '<div class="card"><div class="empty">لا توجد زيوت قير في قاعدة البيانات</div></div>';

        return;
    }

    inventory.transmission_fluids.forEach((fluid)=>{

        let name = "";
        let brand = "";

        if(typeof fluid === "string"){

            name = fluid;

        }else{

            brand = fluid.brand || "";
            name =
                fluid.name ||
                fluid.product ||
                fluid.type ||
                "";

        }

        box.innerHTML += `
            <div class="item">
                <strong>⚙️ ${escapeHtml(name)}</strong>

                ${
                    brand
                    ? `<div class="small">الشركة: ${escapeHtml(brand)}</div>`
                    : ""
                }
            </div>
        `;
    });
}

function renderFilters(){

    const box = document.getElementById("filters");

    box.innerHTML = "";

    if(
        !inventory.oil_filters_raw ||
        inventory.oil_filters_raw.length === 0
    ){

        box.innerHTML =
        '<div class="card"><div class="empty">لا توجد فلاتر في قاعدة البيانات</div></div>';

        return;
    }

    inventory.oil_filters_raw.forEach((filter)=>{

        let name = "";

        if(typeof filter === "string"){

            name = filter;

        }else{

            name =
                filter.name ||
                filter.code ||
                filter.brand ||
                filter.product ||
                "";

        }

        box.innerHTML += `
            <div class="item">
                <strong>🔧 ${escapeHtml(name)}</strong>
            </div>
        `;
    });
}

function renderStock(){

    const box = document.getElementById("stock");

    let stock = [];

    try{

        stock = JSON.parse(
            localStorage.getItem("oilStock") || "[]"
        );

    }catch(e){

        stock = [];
    }

    if(stock.length === 0){

        box.innerHTML = `
            <div class="card">
                <div class="empty">
                    مخزون الزيوت فارغ حاليًا
                </div>
            </div>
        `;

        return;
    }

    box.innerHTML = "";

    stock.forEach((item)=>{

        let name =
            typeof item === "string"
            ? item
            : item.name || item.product || "زيت";

        box.innerHTML += `
            <div class="item">
                <strong>📦 ${escapeHtml(name)}</strong>
            </div>
        `;
    });
}

let cars = [];

function searchCar(){

    const input =
        document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    const result =
        document.getElementById("result");

    if(!input){

        result.innerHTML = `
            <div class="card">
                <div class="empty">
                    اكتب اسم السيارة أولاً 🔍
                </div>
            </div>
        `;

        return;
    }

    const matches =
        cars.filter(car =>
            car.name
            .toLowerCase()
            .includes(input)
        );

    if(matches.length === 0){

        result.innerHTML = `
            <div class="card">
                <div class="empty">
                    ❌ ما لكيت سيارة بهذا الاسم حاليًا
                    <br><br>
                    قاعدة السيارات راح نوسعها بالخطوة الجاية.
                </div>
            </div>
        `;

        return;
    }

    result.innerHTML = "";

    matches.forEach(showResult);
}

function quickSearch(name){

    document.getElementById("searchInput").value = name;

    searchCar();
}

function showResult(car){

    const result =
        document.getElementById("result");

    result.innerHTML += `

        <div class="card">

            <h2>🚗 ${escapeHtml(car.name)}</h2>

            <div class="info">

                <div>
                    <strong>المحرك</strong><br>
                    ${escapeHtml(car.engine)}
                </div>

                <div>
                    <strong>عدد السلندرات</strong><br>
                    ${escapeHtml(car.cylinders)}
                </div>

                <div>
                    <strong>القير</strong><br>
                    ${escapeHtml(car.transmission)}
                </div>

                <div>
                    <strong>زيت المحرك</strong><br>
                    ${escapeHtml(car.oil)}
                </div>

                <div>
                    <strong>كمية الزيت</strong><br>
                    ${escapeHtml(car.oilQty)}
                </div>

                <div>
                    <strong>زيت القير</strong><br>
                    ${escapeHtml(car.gearOil)}
                </div>

                <div>
                    <strong>فلتر الزيت</strong><br>
                    ${escapeHtml(car.filter)}
                </div>

            </div>

            <div class="status">
                ⚠️ المواصفات والسعات والتوافق تحتاج تحقق من المصدر قبل اعتمادها.
            </div>

        </div>

    `;
}

function escapeHtml(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}
    
async function loadCars(){

    try{

        const response = await fetch("./cars.json", {
            cache: "no-store"
        });

        if(!response.ok){
            throw new Error("تعذر تحميل cars.json");
        }

        const data = await response.json();
        
        cars = data.cars || [];
  
        console.log("تم تحميل قاعدة السيارات:", data.cars);

    }catch(error){

        console.error("خطأ في تحميل السيارات:", error);

    }

}

loadInventory();
loadCars();
    
</script>

</body>
</html>
